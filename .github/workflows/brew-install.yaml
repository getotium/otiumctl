name: Homebrew install
# Installs otiumctl from the tap the way a user would, on macOS (Apple Silicon and Intel) and
# Linux, after every release and on demand: the check that the cask GoReleaser wrote works.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew (Linux)
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@master
      - name: Install from the tap
        run: brew install getotium/tap/otiumctl
      - name: Run it
        run: |
          otiumctl version
          otiumctl version | grep -E '^otiumctl v[0-9]+\.[0-9]+\.[0-9]+$'
