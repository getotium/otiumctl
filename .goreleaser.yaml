# Release builds of otiumctl: a static binary per platform, archived with the LICENSE and
# README, and a checksums file. Runs from .github/workflows/release.yaml on a v* tag.
version: 2

project_name: otiumctl

builds:
  - id: otiumctl
    main: .
    binary: otiumctl
    env:
      - CGO_ENABLED=0 # the keychain clients are pure Go on every platform
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: otiumctl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

# The Homebrew cask, written to getotium/homebrew-tap on each release (GoReleaser replaced
# formulae with casks; see goreleaser.com/deprecations/#brews):
#   brew install getotium/tap/otiumctl
# HOMEBREW_TAP_TOKEN is a fine-grained token with Contents: write on that repo only.
homebrew_casks:
  - name: otiumctl
    binaries: [otiumctl]
    directory: Casks
    homepage: https://getotium.ai/docs/cli
    description: Otium's command-line client
    repository:
      owner: getotium
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: otium-release
      email: noreply@getotium.ai
    # The binaries are not yet signed or notarized, so macOS would quarantine a downloaded one and
    # refuse to run it. Clear the flag on the staged binary, as GoReleaser's docs show. Only where
    # xattr exists: Linux has none, and a failing hook aborts the install.
    hooks:
      post:
        install_steps: |
          run "/bin/sh", args: ["-c", "[ ! -x /usr/bin/xattr ] || /usr/bin/xattr -dr com.apple.quarantine \"$1\"", "sh", "{{ .StagedPath }}/otiumctl"]
